services:
  - type: web
    name: cute momma
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 18.17.0
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: sessions
      mountPath: /opt/render/project/src/sessions
      sizeGB: 1